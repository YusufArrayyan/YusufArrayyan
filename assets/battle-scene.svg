<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#12091e"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e1e"/>
      <stop offset="100%" stop-color="#080815"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl3">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    /* Samurai attack cycle - 7s */
    @keyframes samuraiAtk {
      0%, 22% { transform: translateX(0) rotate(0deg); }
      30% { transform: translateX(30px) rotate(-2deg); }
      38% { transform: translateX(130px) rotate(-8deg); }
      44% { transform: translateX(110px) rotate(5deg); }
      52% { transform: translateX(60px) rotate(0deg); }
      62%, 100% { transform: translateX(0) rotate(0deg); }
    }
    @keyframes enemyHit {
      0%, 36% { transform: translateX(0); }
      40% { transform: translateX(18px); }
      43% { transform: translateX(-8px); }
      47% { transform: translateX(10px); }
      53% { transform: translateX(-3px); }
      60%, 100% { transform: translateX(0); }
    }
    @keyframes enemyFlash {
      0%, 36% { opacity: 1; }
      39% { opacity: 0.3; }
      42% { opacity: 0.9; }
      45% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes slashFx {
      0%, 35% { opacity: 0; transform: scale(0.2) rotate(-60deg); }
      39% { opacity: 1; transform: scale(1.3) rotate(-10deg); }
      44% { opacity: 0.7; transform: scale(1) rotate(10deg); }
      50% { opacity: 0; transform: scale(1.8) rotate(30deg); }
      100% { opacity: 0; }
    }
    @keyframes dmgFloat {
      0%, 38% { opacity: 0; transform: translateY(0); }
      42% { opacity: 1; transform: translateY(0); font-size: 22px; }
      48% { opacity: 1; transform: translateY(-15px); font-size: 20px; }
      62% { opacity: 0.6; transform: translateY(-40px); font-size: 18px; }
      72% { opacity: 0; transform: translateY(-55px); }
      100% { opacity: 0; }
    }
    @keyframes spark {
      0%, 38% { opacity: 0; transform: translate(0,0) scale(1); }
      41% { opacity: 1; transform: translate(0,0) scale(1); }
      55% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes spark1 { 0%,38%{opacity:0;transform:translate(0,0)}41%{opacity:1}55%{opacity:0;transform:translate(25px,-20px)}100%{opacity:0} }
    @keyframes spark2 { 0%,38%{opacity:0;transform:translate(0,0)}41%{opacity:1}55%{opacity:0;transform:translate(-15px,-25px)}100%{opacity:0} }
    @keyframes spark3 { 0%,38%{opacity:0;transform:translate(0,0)}41%{opacity:1}55%{opacity:0;transform:translate(20px,15px)}100%{opacity:0} }
    @keyframes spark4 { 0%,38%{opacity:0;transform:translate(0,0)}41%{opacity:1}55%{opacity:0;transform:translate(-20px,18px)}100%{opacity:0} }
    @keyframes spark5 { 0%,38%{opacity:0;transform:translate(0,0)}42%{opacity:1}55%{opacity:0;transform:translate(30px,5px)}100%{opacity:0} }
    @keyframes comboFade {
      0%, 42% { opacity: 0; transform: scale(0.5); }
      48% { opacity: 1; transform: scale(1.1); }
      55% { opacity: 0.9; transform: scale(1); }
      72% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; }
    }
    @keyframes hpDrop {
      0%, 38% { width: 135px; }
      45%, 100% { width: 105px; }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.02); }
    }
    @keyframes eyeGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes battlePetal1 {
      0% { transform: translate(0,0) rotate(0deg); opacity:0; }
      5% { opacity:0.6; }
      100% { transform: translate(900px, 80px) rotate(720deg); opacity:0; }
    }
    @keyframes battlePetal2 {
      0% { transform: translate(0,0) rotate(0deg); opacity:0; }
      5% { opacity:0.5; }
      100% { transform: translate(920px, 50px) rotate(-600deg); opacity:0; }
    }
    @keyframes dustDrift {
      0% { transform: translateX(0); opacity: 0.15; }
      50% { transform: translateX(10px); opacity: 0.08; }
      100% { transform: translateX(0); opacity: 0.15; }
    }
    .samurai { animation: samuraiAtk 7s ease-in-out infinite; }
    .oni { animation: enemyHit 7s ease-out infinite; }
    .oni-body { animation: enemyFlash 7s ease-out infinite; }
    .slash { animation: slashFx 7s ease-out infinite; transform-origin: center; }
    .dmg-text { animation: dmgFloat 7s ease-out infinite; }
    .s1 { animation: spark1 7s ease-out infinite; }
    .s2 { animation: spark2 7s ease-out infinite; }
    .s3 { animation: spark3 7s ease-out infinite; }
    .s4 { animation: spark4 7s ease-out infinite; }
    .s5 { animation: spark5 7s ease-out infinite; }
    .combo { animation: comboFade 7s ease-out infinite; }
    .hp-enemy-fill { animation: hpDrop 7s ease-out infinite; }
    .samurai-idle { animation: breathe 3s ease-in-out infinite; transform-origin: bottom center; }
    .oni-idle { animation: breathe 3.5s ease-in-out infinite 0.5s; transform-origin: bottom center; }
    .eye { animation: eyeGlow 2s ease-in-out infinite; }
    .bp1 { animation: battlePetal1 8s linear infinite; }
    .bp2 { animation: battlePetal2 10s linear infinite; animation-delay: 3s; }
    .bp3 { animation: battlePetal1 9s linear infinite; animation-delay: 5s; }
    .bp4 { animation: battlePetal2 11s linear infinite; animation-delay: 1s; }
    .dust { animation: dustDrift 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="350" fill="url(#bg)"/>

  <!-- Game Frame Border -->
  <rect x="2" y="2" width="896" height="346" fill="none" stroke="#2a1530" stroke-width="3" rx="6"/>
  <rect x="5" y="5" width="890" height="340" fill="none" stroke="#1a0f22" stroke-width="1" rx="4"/>

  <!-- HUD Top Bar -->
  <rect x="5" y="5" width="890" height="42" fill="#06060f" opacity="0.8" rx="4"/>
  <line x1="5" y1="47" x2="895" y2="47" stroke="#2a1530" stroke-width="1"/>

  <!-- PLAYER HP -->
  <text x="25" y="20" fill="#d4a574" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">YUSUF — LVL 3</text>
  <rect x="25" y="25" width="180" height="14" fill="#1a1a2e" rx="3" stroke="#2a2a4e" stroke-width="1"/>
  <rect x="27" y="27" width="176" height="10" fill="#1a2a1a" rx="2"/>
  <rect x="27" y="27" width="165" height="10" fill="#44bb44" rx="2"/>
  <text x="210" y="35" fill="#44bb44" font-family="monospace" font-size="9" opacity="0.8">92%</text>

  <!-- ENEMY HP -->
  <text x="685" y="20" fill="#c41e3a" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">ONI DEMON — LVL 5</text>
  <rect x="685" y="25" width="180" height="14" fill="#1a1a2e" rx="3" stroke="#2a2a4e" stroke-width="1"/>
  <rect x="687" y="27" width="176" height="10" fill="#2a1a1a" rx="2"/>
  <rect class="hp-enemy-fill" x="687" y="27" width="135" height="10" fill="#cc3333" rx="2"/>
  <text x="870" y="35" fill="#cc3333" font-family="monospace" font-size="9" opacity="0.8">58%</text>

  <!-- VS indicator -->
  <text x="450" y="35" text-anchor="middle" fill="#c41e3a" font-family="'Courier New', monospace" font-size="14" font-weight="bold" filter="url(#gl)">⚔ DUEL ⚔</text>

  <!-- Ground -->
  <rect x="5" y="275" width="890" height="70" fill="url(#groundGrad)" rx="0"/>
  <line x1="5" y1="277" x2="895" y2="277" stroke="#251530" stroke-width="2"/>
  <line x1="5" y1="282" x2="895" y2="282" stroke="#1a1020" stroke-width="0.5" opacity="0.5"/>
  <line x1="5" y1="292" x2="895" y2="292" stroke="#150e1a" stroke-width="0.3" opacity="0.3"/>

  <!-- Ground dust -->
  <ellipse class="dust" cx="250" cy="282" rx="60" ry="4" fill="white" opacity="0.08"/>
  <ellipse class="dust" cx="650" cy="285" rx="45" ry="3" fill="white" opacity="0.06" style="animation-delay:2s"/>

  <!-- Background elements — distant mountains -->
  <polygon points="5,228 60,198 120,213 180,188 240,206 300,178 360,196 420,183 480,193 540,176 600,190 660,180 720,196 780,183 840,200 895,193 895,277 5,277" fill="#0a0a18" opacity="0.6"/>

  <!-- Moon (small, in background) -->
  <circle cx="780" cy="95" r="25" fill="#1a1530" opacity="0.4"/>
  <circle cx="780" cy="95" r="22" fill="#201840" opacity="0.3"/>

  <!-- ═══ SAMURAI CHARACTER (LEFT) ═══ -->
  <g class="samurai">
    <g class="samurai-idle" transform="translate(220, 210)">
      <!-- Shadow on ground -->
      <ellipse cx="5" cy="93" rx="22" ry="5" fill="black" opacity="0.3"/>
      <!-- Conical hat (kasa) -->
      <polygon points="0,-45 -18,-22 18,-22" fill="#4a4a80"/>
      <line x1="-18" y1="-22" x2="18" y2="-22" stroke="#6a6a90" stroke-width="0.5"/>
      <!-- Head -->
      <circle cx="0" cy="-18" r="7" fill="#555590"/>
      <!-- Neck -->
      <rect x="-3" y="-12" width="6" height="5" fill="#555590"/>
      <!-- Shoulder armor -->
      <rect x="-16" y="-8" width="8" height="6" fill="#5a3a75" rx="1"/>
      <rect x="8" y="-8" width="8" height="6" fill="#5a3a75" rx="1"/>
      <!-- Body / kimono -->
      <polygon points="-14,-7 14,-7 18,35 -18,35" fill="#454580"/>
      <!-- Belt / obi -->
      <rect x="-15" y="10" width="30" height="4" fill="#c41e3a" rx="1"/>
      <!-- Kimono fold line -->
      <line x1="0" y1="-5" x2="2" y2="35" stroke="#4a4a70" stroke-width="0.5"/>
      <!-- Right arm — holding katana extended -->
      <line x1="14" y1="-3" x2="32" y2="-15" stroke="#454580" stroke-width="4" stroke-linecap="round"/>
      <!-- Katana handle -->
      <line x1="30" y1="-14" x2="38" y2="-20" stroke="#774433" stroke-width="3" stroke-linecap="round"/>
      <!-- Katana guard (tsuba) -->
      <ellipse cx="38" cy="-20" rx="3" ry="1.5" fill="#d4a574" transform="rotate(-35 38 -20)"/>
      <!-- Katana blade -->
      <line x1="38" y1="-20" x2="68" y2="-38" stroke="#e0e0ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="38" y1="-20" x2="68" y2="-38" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
      <!-- Left arm -->
      <line x1="-14" y1="-3" x2="-8" y2="15" stroke="#454580" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Legs -->
      <polygon points="-18,35 -14,60 -5,60 -3,35" fill="#3a3a6e"/>
      <polygon points="3,35 5,60 14,60 18,35" fill="#3a3a6e"/>
      <!-- Feet -->
      <ellipse cx="-10" cy="62" rx="6" ry="3" fill="#1e1e40"/>
      <ellipse cx="10" cy="62" rx="6" ry="3" fill="#1e1e40"/>
      <!-- Scabbard -->
      <line x1="-12" y1="12" x2="-25" y2="40" stroke="#2a2a50" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ═══ ONI DEMON (RIGHT) ═══ -->
  <g class="oni">
    <g class="oni-idle" transform="translate(660, 200)">
      <!-- Shadow -->
      <ellipse cx="0" cy="120" rx="28" ry="6" fill="black" opacity="0.3"/>
      <!-- Horns -->
      <polygon points="-14,-58 -10,-38 -17,-40" fill="#cc3050"/>
      <polygon points="14,-58 10,-38 17,-40" fill="#cc3050"/>
      <!-- Head -->
      <circle cx="0" cy="-30" r="14" fill="#703050" class="oni-body"/>
      <!-- Face markings -->
      <line x1="-6" y1="-38" x2="-4" y2="-28" stroke="#703040" stroke-width="1.5"/>
      <line x1="6" y1="-38" x2="4" y2="-28" stroke="#703040" stroke-width="1.5"/>
      <!-- Eyes (glowing red) -->
      <ellipse class="eye" cx="-6" cy="-32" rx="3" ry="2" fill="#ff3333" filter="url(#gl)"/>
      <ellipse class="eye" cx="6" cy="-32" rx="3" ry="2" fill="#ff3333" filter="url(#gl)" style="animation-delay:0.3s"/>
      <!-- Mouth / fangs -->
      <path d="M-7,-22 L-4,-18 L0,-21 L4,-18 L7,-22" stroke="#ff4444" stroke-width="1" fill="none"/>
      <!-- Body — massive armor -->
      <polygon points="-20,-16 20,-16 25,50 -25,50" fill="#552040" class="oni-body"/>
      <!-- Armor plates -->
      <rect x="-22" y="-12" width="10" height="8" fill="#552238" rx="2"/>
      <rect x="12" y="-12" width="10" height="8" fill="#552238" rx="2"/>
      <!-- Chest marking -->
      <circle cx="0" cy="5" r="8" fill="none" stroke="#702838" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="3" fill="#702838" opacity="0.5"/>
      <!-- Belt -->
      <rect x="-22" y="20" width="44" height="5" fill="#5a1828" rx="1"/>
      <!-- Arms — big and menacing -->
      <line x1="-20" y1="-8" x2="-38" y2="8" stroke="#703050" stroke-width="6" stroke-linecap="round" class="oni-body"/>
      <line x1="20" y1="-8" x2="38" y2="8" stroke="#703050" stroke-width="6" stroke-linecap="round" class="oni-body"/>
      <!-- Claws -->
      <line x1="-38" y1="8" x2="-42" y2="2" stroke="#a02040" stroke-width="1.5"/>
      <line x1="-38" y1="8" x2="-44" y2="6" stroke="#a02040" stroke-width="1.5"/>
      <line x1="-38" y1="8" x2="-43" y2="11" stroke="#a02040" stroke-width="1.5"/>
      <line x1="38" y1="8" x2="42" y2="2" stroke="#a02040" stroke-width="1.5"/>
      <line x1="38" y1="8" x2="44" y2="6" stroke="#a02040" stroke-width="1.5"/>
      <line x1="38" y1="8" x2="43" y2="11" stroke="#a02040" stroke-width="1.5"/>
      <!-- Legs -->
      <polygon points="-25,50 -20,80 -8,80 -5,50" fill="#331020"/>
      <polygon points="5,50 8,80 20,80 25,50" fill="#331020"/>
      <!-- Feet -->
      <ellipse cx="-14" cy="82" rx="8" ry="4" fill="#2a0e18"/>
      <ellipse cx="14" cy="82" rx="8" ry="4" fill="#2a0e18"/>
    </g>
  </g>

  <!-- ═══ SLASH EFFECT ═══ -->
  <g class="slash" transform="translate(530, 195)" opacity="0">
    <!-- Main slash lines -->
    <line x1="-30" y1="-25" x2="30" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="20" x2="28" y2="-22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-35" y1="0" x2="35" y2="-5" stroke="#c41e3a" stroke-width="4" stroke-linecap="round" filter="url(#gl2)"/>
    <!-- Inner glow -->
    <circle cx="0" cy="0" r="15" fill="#ff4444" opacity="0.15" filter="url(#gl3)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- ═══ HIT SPARKS ═══ -->
  <g transform="translate(540, 195)">
    <circle class="s1" cx="0" cy="0" r="2.5" fill="#ffcc44" opacity="0"/>
    <circle class="s2" cx="0" cy="0" r="2" fill="#ff8844" opacity="0"/>
    <circle class="s3" cx="0" cy="0" r="3" fill="#ffaa33" opacity="0"/>
    <circle class="s4" cx="0" cy="0" r="2" fill="#ffdd55" opacity="0"/>
    <circle class="s5" cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0"/>
  </g>

  <!-- ═══ DAMAGE NUMBER ═══ -->
  <text class="dmg-text" x="580" y="165" text-anchor="middle" fill="#ff4444" font-family="'Courier New', monospace" font-size="22" font-weight="bold" filter="url(#gl)" opacity="0">-42</text>

  <!-- ═══ COMBO TEXT ═══ -->
  <text class="combo" x="450" y="315" text-anchor="middle" fill="#d4a574" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="3" filter="url(#gl)" opacity="0">⚔ COMBO x3 ⚔</text>

  <!-- ═══ CHERRY BLOSSOM WIND ═══ -->
  <ellipse class="bp1" cx="-20" cy="120" rx="3.5" ry="1.8" fill="#ffb7c5" opacity="0"/>
  <ellipse class="bp2" cx="-20" cy="180" rx="3" ry="1.5" fill="#ffc5d3" opacity="0"/>
  <ellipse class="bp3" cx="-20" cy="90" rx="4" ry="2" fill="#ffb0be" opacity="0"/>
  <ellipse class="bp4" cx="-20" cy="200" rx="3" ry="1.5" fill="#ffd0dc" opacity="0"/>

  <!-- ═══ BOTTOM HUD ═══ -->
  <rect x="5" y="325" width="890" height="20" fill="#06060f" opacity="0.7" rx="0"/>
  <line x1="5" y1="325" x2="895" y2="325" stroke="#2a1530" stroke-width="1"/>
  <text x="25" y="339" fill="#8b7355" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">STANCE: STONE</text>
  <text x="450" y="339" text-anchor="middle" fill="#5a4a3a" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">RESOLVE ◆◆◆◇◇</text>
  <text x="870" y="339" text-anchor="end" fill="#8b7355" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">HONOR: 🌸🌸🌸</text>
</svg>
