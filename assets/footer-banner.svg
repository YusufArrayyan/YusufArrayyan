<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="footerSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0a18"/>
    </linearGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes footerFog {
      0%, 100% { transform: translateX(0); opacity: 0.06; }
      50% { transform: translateX(25px); opacity: 0.03; }
    }
    @keyframes lanternGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }
    @keyframes fpetal1 {
      0% { transform: translate(0,0) rotate(0deg); opacity:0; }
      5% { opacity:0.7; }
      100% { transform: translate(40px,220px) rotate(300deg); opacity:0; }
    }
    @keyframes fpetal2 {
      0% { transform: translate(0,0) rotate(0deg); opacity:0; }
      5% { opacity:0.65; }
      100% { transform: translate(-30px,220px) rotate(-280deg); opacity:0; }
    }
    .footer-fog { animation: footerFog 15s ease-in-out infinite; }
    .lantern { animation: lanternGlow 3s ease-in-out infinite; }
    .fp1 { animation: fpetal1 12s linear infinite; }
    .fp2 { animation: fpetal2 14s linear infinite; animation-delay: 3s; }
    .fp3 { animation: fpetal1 11s linear infinite; animation-delay: 6s; }
    .fp4 { animation: fpetal2 13s linear infinite; animation-delay: 1.5s; }
    .fp5 { animation: fpetal1 15s linear infinite; animation-delay: 8s; }
  </style>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#footerSky)"/>

  <!-- Ground hills -->
  <polygon points="0,160 100,152 200,155 300,148 400,152 500,145 600,150 700,155 800,148 900,155 900,200 0,200" fill="#0a0a15"/>

  <!-- Torii gate (center) -->
  <g transform="translate(450, 110)">
    <path d="M-22,-28 Q-24,-32 0,-34 Q24,-32 22,-28 L20,-26 Q0,-28 -20,-26 Z" fill="#5a1018" opacity="0.7"/>
    <rect x="-18" y="-23" width="36" height="2.5" fill="#4a0e15" opacity="0.7" rx="1"/>
    <rect x="-17" y="-22" width="3" height="42" fill="#4a0e15" opacity="0.7"/>
    <rect x="14" y="-22" width="3" height="42" fill="#4a0e15" opacity="0.7"/>
  </g>

  <!-- Lanterns -->
  <ellipse class="lantern" cx="430" cy="102" rx="3" ry="4" fill="#ff6633" opacity="0.6" filter="url(#fGlow)"/>
  <ellipse class="lantern" cx="470" cy="102" rx="3" ry="4" fill="#ff6633" opacity="0.6" filter="url(#fGlow)" style="animation-delay:1.5s"/>

  <!-- Fog -->
  <ellipse class="footer-fog" cx="300" cy="155" rx="350" ry="8" fill="white" opacity="0.05"/>
  <ellipse class="footer-fog" cx="600" cy="160" rx="300" ry="6" fill="white" opacity="0.04" style="animation-delay:5s"/>

  <!-- Falling petals -->
  <ellipse class="fp1" cx="200" cy="-5" rx="3" ry="1.5" fill="#ffb7c5" opacity="0"/>
  <ellipse class="fp2" cx="400" cy="-5" rx="3.5" ry="1.8" fill="#ffc5d3" opacity="0"/>
  <ellipse class="fp3" cx="600" cy="-5" rx="3" ry="1.5" fill="#ffb0be" opacity="0"/>
  <ellipse class="fp4" cx="750" cy="-5" rx="4" ry="2" fill="#ffb7c5" opacity="0"/>
  <ellipse class="fp5" cx="100" cy="-5" rx="3.5" ry="1.8" fill="#ffd0dc" opacity="0"/>

  <!-- Continue text -->
  <text x="450" y="185" text-anchor="middle" fill="#d4a574" font-family="Georgia, serif" font-size="11" letter-spacing="6" opacity="0.5">CONTINUE YOUR JOURNEY  ▸</text>

  <!-- Decorative bottom line -->
  <line x1="200" y1="195" x2="700" y2="195" stroke="#c41e3a" stroke-width="0.5" opacity="0.2"/>
</svg>
